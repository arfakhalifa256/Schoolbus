/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  doc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBxbArCZ6iIWQ8wS7QIonZOeN4t_r9o2WU",

  authDomain:
    "schoolbus-6a7fd.firebaseapp.com",

  databaseURL:
    "https://schoolbus-6a7fd-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "schoolbus-6a7fd",

  storageBucket:
    "schoolbus-6a7fd.firebasestorage.app",

  messagingSenderId:
    "486602913199",

  appId:
    "1:486602913199:web:9547f39f5f57f9c87b2b5a"

};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =====================================================
   LOGIN
===================================================== */

const role =
  localStorage.getItem("role");

const driverIdLogin =
  localStorage.getItem("driverId");

let selectedDriver = null;
let daftarDriver = [];


/* =====================================================
   DEFAULT HARGA
===================================================== */

let configHarga = {

  hargaDasar: 608000,

  kenaikanPerTitik: 7800

};


/* =====================================================
   ELEMENT
===================================================== */

const pilihDriver =
  document.getElementById("pilihDriver");

const driverCard =
  document.getElementById("driverCard");

const siswaContainer =
  document.getElementById("siswaContainer");

const displayDriver =
  document.getElementById("displayDriver");

const tanggalInput =
  document.getElementById("tanggalInput");

const namaSiswa =
  document.getElementById("namaSiswa");

const kelas =
  document.getElementById("kelas");

const alamat =
  document.getElementById("alamat");

const noTelepon =
  document.getElementById("noTelepon");

const jarak =
  document.getElementById("jarak");

const trayek =
  document.getElementById("trayek");

const hargaOneWay =
  document.getElementById("hargaOneWay");

const discOneWay =
  document.getElementById("discOneWay");

const totalOneWay =
  document.getElementById("totalOneWay");

const hargaPP =
  document.getElementById("hargaPP");

const discPP =
  document.getElementById("discPP");

const totalPP =
  document.getElementById("totalPP");

const onewaySection =
  document.getElementById("onewaySection");

const ppSection =
  document.getElementById("ppSection");

const previewTotal =
  document.getElementById("previewTotal");

const toast =
  document.getElementById("toast");

const namaHeader =
  document.getElementById("namaHeader");

const roleHeader =
  document.getElementById("roleHeader");

const btnKembali =
  document.getElementById("btnKembali");

const btnLanjut =
  document.getElementById("btnLanjut");

const btnSimpan =
  document.getElementById("btnSimpan");


/* =====================================================
   CEK LOGIN
===================================================== */

if(!role){

  window.location.href =
    "index.html";

}else{

  namaHeader.textContent =
    localStorage.getItem("nama") ||
    localStorage.getItem("username") ||
    "Admin";

  roleHeader.textContent =
    String(role).toUpperCase();

}


/* =====================================================
   TANGGAL HARI INI
===================================================== */

function getToday(){

  const d = new Date();

  const tahun =
    d.getFullYear();

  const bulan =
    String(d.getMonth() + 1)
      .padStart(2,"0");

  const tanggal =
    String(d.getDate())
      .padStart(2,"0");

  return `${tahun}-${bulan}-${tanggal}`;

}


/* =====================================================
   FORMAT RUPIAH
===================================================== */

function rupiah(angka){

  return "Rp " +
    Number(angka || 0)
      .toLocaleString("id-ID");

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(msg){

  toast.textContent = msg;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2500);

}


/* =====================================================
   LOAD CONFIG HARGA
===================================================== */

async function loadConfigHarga(){

  try{

    const snap =
      await getDoc(
        doc(db,"config","harga")
      );

    if(snap.exists()){

      const data =
        snap.data();

      configHarga = {

        hargaDasar:
          Number(
            data.hargaDasar ??
            608000
          ),

        kenaikanPerTitik:
          Number(
            data.kenaikanPerTitik ??
            7800
          )

      };

    }

  }catch(error){

    console.log(
      "Config harga tidak ditemukan, menggunakan default.",
      error
    );

  }

}


/* =====================================================
   LOAD DRIVER
===================================================== */

async function loadDrivers(){

  try{

    pilihDriver.innerHTML =
      '<option value="">-- Memuat driver... --</option>';

    const snapshot =
      await getDocs(
        collection(db,"drivers")
      );

    daftarDriver = [];

    snapshot.forEach(
      (docSnap) => {

        const data =
          docSnap.data();

        daftarDriver.push({

          docId:
            docSnap.id,

          nama:
            data.namaDriver ||
            data.nama ||
            data.username ||
            "Tanpa Nama"

        });

      }
    );


    daftarDriver.sort(
      (a,b) =>
        a.nama.localeCompare(
          b.nama,
          "id"
        )
    );


    /* ADMIN */

    if(role === "admin"){

      driverCard.style.display =
        "block";

      pilihDriver.innerHTML =
        '<option value="">-- Pilih Driver --</option>';

      daftarDriver.forEach(
        (driver,index) => {

          const opt =
            document.createElement(
              "option"
            );

          opt.value =
            index;

          opt.textContent =
            driver.nama;

          pilihDriver.appendChild(
            opt
          );

        }
      );

    }


    /* DRIVER LOGIN */

    else{

      driverCard.style.display =
        "none";

      const driver =
        daftarDriver.find(
          d =>
            d.docId ===
            driverIdLogin
        );


      if(!driver){

        showToast(
          "Driver tidak ditemukan"
        );

        return;

      }


      selectedDriver =
        driver;

      displayDriver.textContent =
        driver.nama;

      siswaContainer.style.display =
        "block";

      resetForm();

    }

  }catch(error){

    console.error(
      "Gagal load driver:",
      error
    );

    showToast(
      "Gagal memuat data driver"
    );

  }

}


/* =====================================================
   LANJUT INPUT SISWA
===================================================== */

function lanjutSiswa(){

  const pilih =
    pilihDriver.value;

  if(pilih === ""){

    showToast(
      "Pilih driver dulu"
    );

    return;

  }


  selectedDriver =
    daftarDriver[
      Number(pilih)
    ];


  if(!selectedDriver){

    showToast(
      "Driver tidak valid"
    );

    return;

  }


  displayDriver.textContent =
    selectedDriver.nama;

  siswaContainer.style.display =
    "block";

  resetForm();

  siswaContainer.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  tanggalInput.value =
    getToday();

  namaSiswa.value = "";
  kelas.value = "";
  alamat.value = "";
  noTelepon.value = "";
  jarak.value = "";

  trayek.value = "";

  discOneWay.value = "0";
  discPP.value = "0";

  hargaOneWay.value = "";
  hargaPP.value = "";

  totalOneWay.value = "";
  totalPP.value = "";

  onewaySection.style.display =
    "none";

  ppSection.style.display =
    "none";

  previewTotal.textContent =
    "Preview Total: Rp 0";

}


/* =====================================================
   HITUNG HARGA DASAR
===================================================== */

function hitungHargaDasar(jarakValue){

  const jarakAngka =
    Number(jarakValue || 0);


  if(jarakAngka <= 1){

    return Number(
      configHarga.hargaDasar
    );

  }


  /*
    Contoh:

    1.1 km
    (1.1 - 1) / 0.1 = 1
    = 1 titik

    1.2 km
    = 2 titik
  */

  const titik =
    Math.ceil(
      (
        jarakAngka - 1
      ) / 0.1
    );


  return Number(
    configHarga.hargaDasar
  ) +
  (
    titik *
    Number(
      configHarga.kenaikanPerTitik
    )
  );

}


/* =====================================================
   UBAH TRAYEK
===================================================== */

function ubahTrayek(){

  const nilai =
    trayek.value;


  if(
    nilai === "pergi" ||
    nilai === "pulang"
  ){

    onewaySection.style.display =
      "block";

    ppSection.style.display =
      "none";

  }

  else if(
    nilai === "pp"
  ){

    onewaySection.style.display =
      "none";

    ppSection.style.display =
      "block";

  }

  else{

    onewaySection.style.display =
      "none";

    ppSection.style.display =
      "none";

  }


  updateHarga();

}


/* =====================================================
   UPDATE HARGA
===================================================== */

function updateHarga(){

  const jarakValue =
    Number(
      jarak.value || 0
    );

  const trayekValue =
    trayek.value;


  if(
    !jarakValue ||
    !trayekValue
  ){

    return;

  }


  const harga =
    hitungHargaDasar(
      jarakValue
    );


  if(
    trayekValue === "pergi" ||
    trayekValue === "pulang"
  ){

    hargaOneWay.value =
      rupiah(
        Math.round(harga)
      );

  }


  if(
    trayekValue === "pp"
  ){

    hargaPP.value =
      rupiah(
        Math.round(
          harga * 2
        )
      );

  }


  hitungTotal();

}


/* =====================================================
   HITUNG TOTAL
===================================================== */

function hitungTotal(){

  const jarakValue =
    Number(
      jarak.value || 0
    );

  const trayekValue =
    trayek.value;


  if(
    !jarakValue ||
    !trayekValue
  ){

    previewTotal.textContent =
      "Preview Total: Rp 0";

    return 0;

  }


  const harga =
    hitungHargaDasar(
      jarakValue
    );


  let total = 0;


  /* ONE WAY */

  if(
    trayekValue === "pergi" ||
    trayekValue === "pulang"
  ){

    let diskon =
      Number(
        discOneWay.value || 0
      );


    diskon =
      Math.min(
        100,
        Math.max(0,diskon)
      );


    total =
      harga -
      (
        harga *
        diskon /
        100
      );


    totalOneWay.value =
      rupiah(
        Math.round(total)
      );

  }


  /* PP */

  if(
    trayekValue === "pp"
  ){

    const hargaPPValue =
      harga * 2;


    let diskon =
      Number(
        discPP.value || 0
      );


    diskon =
      Math.min(
        100,
        Math.max(0,diskon)
      );


    total =
      hargaPPValue -
      (
        hargaPPValue *
        diskon /
        100
      );


    totalPP.value =
      rupiah(
        Math.round(total)
      );

  }


  total =
    Math.round(total);


  previewTotal.textContent =
    "Preview Total: " +
    rupiah(total);


  return total;

}


/* =====================================================
   VALIDASI TELEPON
===================================================== */

function normalisasiTelepon(no){

  return String(no || "")
    .trim()
    .replace(/\s+/g," ");

}


/* =====================================================
   SIMPAN DATA
===================================================== */

async function simpanData(){

  if(!selectedDriver){

    showToast(
      "Driver belum dipilih"
    );

    return;

  }


  const tanggalValue =
    tanggalInput.value;

  const namaValue =
    namaSiswa.value.trim();

  const kelasValue =
    kelas.value.trim();

  const alamatValue =
    alamat.value.trim();

  const teleponValue =
    normalisasiTelepon(
      noTelepon.value
    );

  const jarakValue =
    Number(
      jarak.value || 0
    );

  const trayekValue =
    trayek.value;

  const total =
    hitungTotal();


  /* VALIDASI */

  if(
    !tanggalValue ||
    !namaValue ||
    !kelasValue ||
    !teleponValue ||
    !alamatValue ||
    !jarakValue ||
    !trayekValue ||
    total <= 0
  ){

    showToast(
      "Lengkapi semua data terlebih dahulu"
    );

    return;

  }


  /* CEK DISKON */

  let diskon = 0;

  if(
    trayekValue === "pp"
  ){

    diskon =
      Number(
        discPP.value || 0
      );

  }else{

    diskon =
      Number(
        discOneWay.value || 0
      );

  }


  /* DATA FIRESTORE */

  const data = {

    driverId:
      selectedDriver.docId,

    namaDriver:
      selectedDriver.nama,

    tanggal:
      tanggalValue,

    namaSiswa:
      namaValue,

    kelas:
      kelasValue,

    noTelepon:
      teleponValue,

    alamat:
      alamatValue,

    jarak:
      jarakValue,

    trayek:
      trayekValue,

    diskon:
      diskon,

    total:
      total,

    createdAt:
      serverTimestamp()

  };


  try{

    /* disable tombol */

    btnSimpan.disabled =
      true;

    btnSimpan.textContent =
      "⏳ Menyimpan...";


    await addDoc(
      collection(
        db,
        "perjalanan"
      ),
      data
    );


    showToast(
      "✅ Data perjalanan berhasil disimpan"
    );


    /*
      Reset hanya form siswa.
      Driver tetap dipertahankan.
    */

    resetForm();


    displayDriver.textContent =
      selectedDriver.nama;


  }catch(error){

    console.error(
      "Gagal simpan:",
      error
    );

    showToast(
      "Gagal simpan: " +
      error.message
    );

  }finally{

    btnSimpan.disabled =
      false;

    btnSimpan.textContent =
      "💾 Simpan Data";

  }

}
