<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Driver</title>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --primary:#1e90ff;
  --primary-dark:#0f6ecf;
}

html, body {
  width: 100%;max-width: 100%;overflow-x: hidden;
  font-family:'Poppins',Arial,sans-serif;
  background:#f4f6f9;margin:0;
}
*{box-sizing: border-box;}

.card, .table-wrapper {width: 100%;max-width: 100%;}
.table-wrapper {overflow-x: auto;-webkit-overflow-scrolling: touch;}
table {min-width: 100%;width: max-content;}

.content{padding:16px}
.menu-toggle{position:fixed;top:10px;left:10px;width:32px;height:32px;background:#1e90ff;color:#fff;border:none;border-radius:8px;font-size:18px;z-index:1100}
.card{font-size:13px;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
input,button{padding:10px;border-radius:10px;border:1.5px solid #ddd;font-size:13px;width:100%;margin-bottom:10px;box-sizing:border-box;font-family:'Poppins',sans-serif}
button{background:#1e90ff;color:#fff;border:none;cursor:pointer;font-weight:600}
button:hover{background:var(--primary-dark)}
.driver-item{padding:12px;border-bottom:1px solid #eee}
.small{font-size:12px;color:#666}
.actions{display:flex;gap:6px;margin-top:8px}
.edit{background:#f59e0b}
.delete{background:#ef4444}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:2000}
.popup-content{background:#fff;padding:20px;border-radius:14px;width:90%;max-width:320px}
.btn-cancel{background:#aaa}

/* ===== HEADER BARU ===== */
header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; /* 🔥 tadi kamu tulis color:blue */
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 12px rgba(30,144,255,0.3);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand img {
  width: 40px;
  height: 40px;
  border-radius: 12px; /* kotak rounded biar modern */
  object-fit: cover;
  background: #fff;
  padding: 3px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1)
}

.brand-text .subtitle {
  font-size: 10px;
  opacity: 0.9;
  line-height: 1;
  letter-spacing:0.5px
}

.brand-text .title {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.header-actions {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-back {
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
  color: #fff; width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; cursor:pointer
}
.header-actions .btn-back:hover {
  background: rgba(255,255,255,0.3);
  transform: translateX(-2px);
}

@media(max-width:768px){
  .brand-text .title{font-size:14px}
  .brand img{width:36px;height:36px}
}
  .header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-info{
  text-align:right;
   /* disembunyikan di HP kecil */
}

.user-name{
  font-size:12px;
  font-weight:700;
  line-height:1.2;
}

.user-role{
  font-size:9px;
  background:rgba(255,255,255,0.25);
  padding:2px 6px;
  border-radius:20px;
  font-weight:600;
  letter-spacing:0.5px;
}

@media(min-width:480px){
  .user-info{display:block} /* muncul kalau layar > 480px */
}
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="brand">
      <img src="img/icon-192.png">
      <div class="brand-text">
        <div class="subtitle">SCHOOL BUS</div>
        <div class="title">ARFA</div>
      </div>
    </div>
  </div>
  
  <div class="header-right">
    <div class="user-info">
      <div class="user-name" id="namaHeader">Admin</div>
      <div class="user-role" id="roleHeader">ADMIN</div>
    </div>
    <button class="btn-back" onclick="kembali()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>
</header>

<div class="content">
<h4 id="formTitle">➕ Tambah Driver</h4>

<div class="card">
  <input type="text" id="nama" placeholder="Nama Lengkap Driver">
  <input type="text" id="noHp" placeholder="No HP">
  <input type="text" id="alamat" placeholder="Alamat">
  <input type="date" id="tglInput">
  <input type="password" id="password" placeholder="Password default: 123456">
  <button id="btnSave" onclick="saveDriver()">Simpan</button>
  <button id="btnCancel" onclick="cancelEdit()" style="display:none;background:#aaa;">Batal</button>
</div>

<div class="card">
  <h4>📋 List Driver</h4>
  <div id="list"></div>
</div>

<div id="popupEdit" class="popup">
  <div class="popup-content">
    <h3>Edit Driver</h3>
    <input type="text" id="editNama">
    <input type="text" id="editNoHp">
    <input type="text" id="editAlamat">
    <input type="date" id="editTgl">
    <input type="password" id="editPassword" placeholder="Password baru, kosongkan jika tidak diganti">
    <button onclick="updateDriver()">Update</button>
    <button onclick="closePopup()" class="btn-cancel">Batal</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, setDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxbArCZ6iIWQ8wS7QIonZOeN4t_r9o2WU",
  authDomain: "schoolbus-6a7fd.firebaseapp.com",
  projectId: "schoolbus-6a7fd",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 CUMA 1X DECLARE ROLE
const userLogin = localStorage.getItem("username") || "";
const roleUpper = (localStorage.getItem("role") || "admin").toUpperCase(); // buat header
const roleLower = (localStorage.getItem("role") || "").toLowerCase(); // buat logic

document.getElementById("namaHeader").innerText = userLogin;
document.getElementById("roleHeader").innerText = roleUpper;

const namaEl = document.getElementById("nama");
const noHpEl = document.getElementById("noHp");
const alamatEl = document.getElementById("alamat");
const tglEl = document.getElementById("tglInput");
const passEl = document.getElementById("password");
const listEl = document.getElementById("list");

// Sembunyikan menu config kalau bukan admin
if(roleLower !== "admin"){
  // karena kamu udah hapus sidebar, ini bisa dihapus
}

let drivers = [];
let editId = null;
let editDriverId = null;

let q;
if(roleLower === "admin"){
  q = query(collection(db,"drivers"), orderBy("createdAt","desc"));
}else{
  q = query(collection(db,"drivers"), where("user","==",userLogin));
}

onSnapshot(q, snap=>{
  drivers = [];
  snap.forEach(d=>{
    drivers.push({id:d.id, ...d.data()});
  });
  render(drivers);
});

window.saveDriver = async function(){
  const nama = namaEl.value.trim();
  const noHp = noHpEl.value.trim();
  const alamat = alamatEl.value.trim();
  const tgl = tglEl.value;
  const password = passEl.value.trim() || "123456";

  if(!nama ||!noHp ||!alamat ||!tgl){
    alert("Lengkapi semua data"); return;
  }

  const username = nama.toLowerCase().replace(/\s+/g,'');
  const driverId = username;

  try {
    await setDoc(doc(db,"drivers", driverId),{
      driverId, nama, noHp, alamat, tglInput: tgl,
      username, namaDriver: nama,
      user: userLogin, createdAt: Date.now()
    });

    await setDoc(doc(db,"users", driverId), {
      driverId,
      namaDriver: nama,
      username, password, role: "driver",
      createdAt: Date.now()
    });

    alert(`✅ Driver berhasil\nUsername: ${username}\nPassword: ${password}`);
    resetForm();
  } catch(e) { alert("Gagal: " + e.message); }
};

window.edit = function(d){
  if(roleLower !== "admin" && d.user !== userLogin){
    alert("Tidak punya akses");
    return;
  }
  editId = d.id;
  editDriverId = d.driverId;
  document.getElementById("editNama").value = d.nama || "";
  document.getElementById("editNoHp").value = d.noHp || "";
  document.getElementById("editAlamat").value = d.alamat || "";
  document.getElementById("editTgl").value = d.tglInput || "";
  document.getElementById("popupEdit").style.display = "flex";
};

window.updateDriver = async function(){
  const nama = document.getElementById("editNama").value.trim();
  const pass = document.getElementById("editPassword").value.trim();
  
  const dataUpdate = {
    nama: nama,
    namaDriver: nama,
    noHp: document.getElementById("editNoHp").value,
    alamat: document.getElementById("editAlamat").value,
    tglInput: document.getElementById("editTgl").value
  };

  await updateDoc(doc(db,"drivers", editDriverId), dataUpdate);

  const userUpdate = { namaDriver: nama };
  if(pass) userUpdate.password = pass;
  await updateDoc(doc(db,"users", editDriverId), userUpdate);

  alert("✅ Data berhasil diupdate");
  closePopup();
};

window.del = async function(driverId){
  if(!confirm("Hapus driver + user login ini?")) return;
  try{
    await deleteDoc(doc(db,"drivers", driverId));
    await deleteDoc(doc(db,"users", driverId));
    alert("✅ Driver dihapus");
  }catch(e){
    alert("Gagal hapus: " + e.message);
  }
};

window.closePopup = function(){
  document.getElementById("popupEdit").style.display = "none";
  editId = null;
  editDriverId = null;
};

function render(data){
  let html = "";
  data.forEach(d=>{
    const namaTampil = d.nama || d.namaDriver || d.username || "Tanpa Nama";
    html += `
    <div class="driver-item">
      <b>${namaTampil}</b><br>
      <span class="small">HP: ${d.noHp || "-"}</span><br>
      <span class="small">Alamat: ${d.alamat || "-"}</span><br>
      <span class="small">Username: ${d.username || "-"}</span>
      ${(roleLower === "admin" || d.user === userLogin) ? `
      <div class="actions">
        <button class="edit" onclick='edit(${JSON.stringify(d)})'>Edit</button>
        <button class="delete" onclick="del('${d.driverId}')">Hapus</button> 
      </div>
      ` : ""}
    </div>
    `;
  });
  listEl.innerHTML = html || "Tidak ada data";
}

function resetForm(){
  namaEl.value = "";
  noHpEl.value = "";
  alamatEl.value = "";
  tglEl.value = "";
  passEl.value = "";
}

// 🔥 INI FUNGSI BACK YANG BENER
window.kembali=function(){
  if(roleLower === "admin"){
    window.location.href="dashboard.html";
  } else {
    window.location.href="input.html";
  }
}
</script>
</body>
</html>
