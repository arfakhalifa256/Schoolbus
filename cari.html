<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Perjalanan Firebase</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e90ff">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
:root{--primary:#1e90ff;--primary-dark:#0f6ecf;--danger:#ef4444;--success:#16a34a;--warning:#f59e0b;--bg:#f4f7fb;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--shadow:0 4px 12px rgba(15,23,42,.06);--radius:14px}
html, body {width:100%;overflow-x:hidden;font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;}*{box-sizing:border-box}
header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:14px;background:#fff;padding:4px}
.brand-text.subtitle{font-size:10px;opacity:.85;letter-spacing:.8px}.brand-text.title{font-size:18px;font-weight:700}
.btn-back{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.content{padding:16px;max-width:760px;margin:0 auto;padding-bottom:100px}h2{text-align:center;color:var(--primary);margin:16px 0;font-size:18px;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.mini-note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:10px;margin-bottom:14px;font-size:11px;font-weight:500}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;margin-top:12px;color:#374151}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;background:#fff;font-family:'Poppins'}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(30,144,255,.12)}textarea{min-height:90px}input[readonly]{background:#f8fafc;font-weight:700}
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;margin-top:14px}
.btn-primary{background:var(--primary)}.btn-danger{background:var(--danger)}.btn-success{background:var(--success)}.btn-warning{background:var(--warning);color:#111827}
.student-card{padding:14px;border:1px solid var(--border);border-radius:14px;margin-top:12px;background:#fff;cursor:pointer;transition:.2s}.student-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08);border-color:var(--primary)}.student-title{font-weight:700;font-size:15px}.student-sub{font-size:12px;color:var(--muted);line-height:1.6}.empty{text-align:center;color:var(--muted);padding:20px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9998}.popup-box{width:100%;max-width:520px;background:#fff;border-radius:20px;padding:20px}.popup-title{font-size:18px;font-weight:700;margin-bottom:12px}.popup-info{font-size:14px;line-height:1.8;margin-bottom:14px}.popup-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.section-box{padding:14px;border:1px dashed var(--border);border-radius:14px;margin-top:12px;background:#fafcff}.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:9999;text-align:center;font-weight:600}.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="img/icon-192.png"><div><div class="brand-text subtitle">SCHOOL BUS</div><div class="brand-text title">ARFA</div></div></div>
  <div style="display:flex;gap:12px;align-items:center"><div style="text-align:right"><div id="namaHeader" style="font-size:13px;font-weight:700">Admin</div><div id="roleHeader" style="font-size:10px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:20px">ADMIN</div></div><button class="btn-back" onclick="kembali()">⬅️</button></div>
</header>

<h2>Edit Data Perjalanan</h2>
<div class="content">
<div class="card" id="listSection">
  <label>Cari Data</label><input type="text" id="searchBox" placeholder="Cari nama siswa / driver / tanggal">
  <div class="mini-note" id="infoHarga">Memuat konfigurasi harga...</div>
  <div id="resultList"></div>
</div>

<div class="card hidden" id="editSection">
  <label>Driver</label><select id="editDriver"></select>
  <label>Tanggal</label><input type="date" id="editTgl">
  <label>Nama Siswa</label><input type="text" id="editSiswa">
  <label>Kelas</label><input type="text" id="editKelas">
  <label>Alamat</label><textarea id="editAlamat"></textarea>
  <label>No Telepon</label><input type="tel" id="editNoTelepon">
  <label>Jarak (Km)</label><input type="number" id="editJarak" step="0.1" oninput="recalc()">
  <label>Trayek</label><select id="editTrayek" onchange="recalc()"><option value="pergi">Pergi (One Way)</option><option value="pulang">Pulang (One Way)</option><option value="pp">PP 90% (Sesuai Tabel)</option></select>

  <div id="editOneWayBox" class="section-box"><label>Harga One Way (Rp) - Sesuai Tabel</label><input type="text" id="editHargaOneWay" readonly><label>Diskon (%)</label><input type="number" id="editDiscOneWay" value="0" oninput="recalc()"><label>Total One Way (Rp)</label><input type="text" id="editTotalOneWay" readonly></div>

  <div id="editPPBox" class="section-box hidden"><label>Harga PP 90% (Rp) - OW x 1.8</label><input type="text" id="editHargaPP" readonly><label>Diskon PP (%)</label><input type="number" id="editDiscPP" value="0" oninput="recalc()"><label>Total PP (Rp)</label><input type="text" id="editTotalPP" readonly></div>

  <label>Total Akhir (Rp)</label><input type="text" id="editTotal" readonly>
  <button class="btn btn-success" onclick="saveChange()">💾 Simpan Perubahan</button>
  <button class="btn btn-warning" onclick="cancelEdit()">↩️ Batal</button>
</div>
</div>

<div class="popup" id="popupDetail"><div class="popup-box"><div class="popup-title">Detail Perjalanan</div><div class="popup-info" id="popupInfo"></div><div class="popup-actions"><button class="btn btn-primary" onclick="openEditForm()" style="margin-top:0;">Edit</button><button class="btn btn-danger" onclick="deleteSelected()" style="margin-top:0;">Hapus</button><button class="btn btn-warning" onclick="closePopup()" style="margin-top:0;">Tutup</button></div></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc, updateDoc, deleteDoc, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {apiKey:"AIzaSyBxbArCZ6iIWQ8wS7QIonZOeN4t_r9o2WU",authDomain:"schoolbus-6a7fd.firebaseapp.com",databaseURL:"https://schoolbus-6a7fd-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"schoolbus-6a7fd",storageBucket:"schoolbus-6a7fd.firebasestorage.app",messagingSenderId:"486602913199",appId:"1:486602913199:web:9547f39f5f57f9c87b2b5a"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function saveLog(aktivitas, detail=""){
  try{ await addDoc(collection(db, "logs"), { username: localStorage.getItem("username")||"Guest", role: localStorage.getItem("role")||"-", aktivitas, detail, waktu: serverTimestamp() }); }catch(e){}
}

const isLogin = localStorage.getItem("login");const username = (localStorage.getItem("username")||"").toLowerCase();const role = (localStorage.getItem("role") || "").toLowerCase();const driverIdUser = localStorage.getItem("driverId");
document.getElementById("namaHeader").innerText = localStorage.getItem("username") || "User";
document.getElementById("roleHeader").innerText = localStorage.getItem("role")?.toUpperCase() || "USER";
if(isLogin!== "true" ||!username ||!role){window.location.href = "login.html";}

const DEFAULT_HARGA_DASAR = 608000;const DEFAULT_KENAIKAN = 7800;
let allPerjalanan = [];let allDrivers = [];let selectedDocId = null;let selectedData = null;
let configHarga = {hargaDasar: DEFAULT_HARGA_DASAR,kenaikanPerTitik: DEFAULT_KENAIKAN};

// === TABEL TARIF PERSIS SS ===
const TARIF_TABLE = {
  "1":608000,"1.1":615800,"1.2":623600,"1.3":631400,"1.4":639200,"1.5":647000,"1.6":654800,"1.7":662600,"1.8":670400,"1.9":678200,
  "2":686000,"2.1":693800,"2.2":701600,"2.3":709400,"2.4":717200,"2.5":725000,"2.6":732800,"2.7":740600,"2.8":748400,"2.9":756200,
  "3":764000,"3.1":771800,"3.2":779600,"3.3":787400,"3.4":795200,"3.5":803000,"3.6":810800,"3.7":818600,"3.8":826400,"3.9":834200,
  "4":842000,"4.1":849800,"4.2":857600,"4.3":865400,"4.4":873200,"4.5":881000,"4.6":888800,"4.7":896600,"4.8":904400,"4.9":912200,
  "5":920000,"5.1":927800,"5.2":935600,"5.3":943400,"5.4":951200,"5.5":959000,"5.6":966800,"5.7":974600,"5.8":982400,"5.9":990200,
  "6":998000,"6.1":1005800,"6.2":1013600,"6.3":1021400,"6.4":1029200,"6.5":1037000,"6.6":1044800,"6.7":1052600,"6.8":1060400,"6.9":1068200,
  "7":1076000,"7.1":1083800,"7.2":1091600,"7.3":1099400,"7.4":1107200,"7.5":1115000,"7.6":1122800,"7.7":1130600,"7.8":1138400,"7.9":1146200,
  "8":1154000
};

const searchBox = document.getElementById("searchBox");const resultList = document.getElementById("resultList");const popupDetail = document.getElementById("popupDetail");const popupInfo = document.getElementById("popupInfo");const listSection = document.getElementById("listSection");const editSection = document.getElementById("editSection");
const editDriver = document.getElementById("editDriver");const editTgl = document.getElementById("editTgl");const editSiswa = document.getElementById("editSiswa");const editKelas = document.getElementById("editKelas");const editAlamat = document.getElementById("editAlamat");const editNoTelepon = document.getElementById("editNoTelepon");
const editJarak = document.getElementById("editJarak");const editTrayek = document.getElementById("editTrayek");
const editOneWayBox = document.getElementById("editOneWayBox");const editPPBox = document.getElementById("editPPBox");
const editHargaOneWay = document.getElementById("editHargaOneWay");const editDiscOneWay = document.getElementById("editDiscOneWay");const editTotalOneWay = document.getElementById("editTotalOneWay");
const editHargaPP = document.getElementById("editHargaPP");const editDiscPP = document.getElementById("editDiscPP");const editTotalPP = document.getElementById("editTotalPP");const editTotal = document.getElementById("editTotal");

function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
function rupiah(n){return "Rp "+Number(n||0).toLocaleString("id-ID");}
function escapeHtml(t){return String(t??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}

async function loadConfigHarga(){
  try{
    const ref = doc(db, "config", "harga");const snap = await getDoc(ref);
    if(snap.exists()){const d=snap.data();configHarga.hargaDasar=Number(d.hargaDasar??DEFAULT_HARGA_DASAR);configHarga.kenaikanPerTitik=Number(d.kenaikanPerTitik??DEFAULT_KENAIKAN);}
    document.getElementById("infoHarga").textContent=`Tabel SS aktif: 1km=${rupiah(608000)} | PP90%=OWx1.8 | Naik 7.800/0.1km`;
  }catch(e){document.getElementById("infoHarga").textContent=`Default: ${rupiah(DEFAULT_HARGA_DASAR)} / ${rupiah(DEFAULT_KENAIKAN)}`;}
}

// FIX SESUAI TABEL FOTO
function hitungHargaDasar(jarak){
  jarak=Number(jarak);if(!jarak||jarak<=0)return 0;
  if(jarak<1) return 608000;
  let key=jarak.toFixed(1);if(key.endsWith('.0')) key=parseInt(key).toString();
  if(TARIF_TABLE[key]!==undefined) return TARIF_TABLE[key];
  if(jarak>8){ const base8=1154000; const titik=Math.ceil((jarak-8)/0.1); return base8+(titik*7800); }
  const titik=Math.ceil((jarak-1)/0.1); return 608000+(titik*7800);
}

async function loadDrivers(){try{const snap=await getDocs(collection(db,"drivers"));allDrivers=[];snap.forEach(d=>{const data=d.data();if(role!=="admin"){if(driverIdUser && d.id!==driverIdUser) return;} allDrivers.push({docId:d.id,idAnggota:data.idAnggota||"",nama:data.nama||""});});allDrivers.sort((a,b)=>a.nama.localeCompare(b.nama,"id"));renderDriverOptions();}catch(e){showToast("Gagal load driver");}}
function renderDriverOptions(selId="",selNama=""){editDriver.innerHTML='<option value="">-- Pilih Driver --</option>';let ketemu=false;allDrivers.forEach(dr=>{const o=document.createElement("option");o.value=dr.docId;o.textContent=`${dr.nama}${dr.idAnggota?" ("+dr.idAnggota+")":""}`;if(selId&&selId===dr.docId){o.selected=true;ketemu=true;}else if(!ketemu&&selNama&&dr.nama.toLowerCase()===selNama.toLowerCase()){o.selected=true;ketemu=true;}editDriver.appendChild(o);});if(!ketemu&&selNama){const o=document.createElement("option");o.value=selectedData?.driverId||"";o.textContent=`Pertahankan: ${selNama}`;o.selected=true;editDriver.prepend(o);}}

async function loadPerjalanan(){try{const q=query(collection(db,"perjalanan"),orderBy("tanggal","desc"));const snap=await getDocs(q);allPerjalanan=[];snap.forEach(d=>{const data=d.data();if(role!=="admin"){const n=(data.namaDriver||"").toLowerCase();if(n&&n!==username) return;} allPerjalanan.push({docId:d.id,...data});});searchData();}catch(e){resultList.innerHTML='<div class="empty">Gagal memuat data</div>';}}

function searchData(){const key=searchBox.value.trim().toLowerCase();resultList.innerHTML="";const filtered=allPerjalanan.filter(d=>{const teks=`${d.namaSiswa||""} ${d.namaDriver||""} ${d.tanggal||""} ${d.kelas||""} ${d.alamat||""} ${d.trayek||""}`.toLowerCase();return teks.includes(key);});if(!filtered.length){resultList.innerHTML='<div class="empty">Data tidak ditemukan</div>';return;}filtered.forEach(d=>{const div=document.createElement("div");div.className="student-card";div.innerHTML=`<div class="student-title">${escapeHtml(d.namaSiswa||"-")}</div><div class="student-sub">Driver: ${escapeHtml(d.namaDriver||"-")}<br>Tanggal: ${escapeHtml(d.tanggal||"-")}<br>Kelas: ${escapeHtml(d.kelas||"-")}<br>Trayek: ${escapeHtml((d.trayek||"-").toUpperCase())} | Total: ${escapeHtml(rupiah(d.total||0))}</div>`;div.onclick=()=>openPopup(d.docId);resultList.appendChild(div);});}

function openPopup(id){selectedDocId=id;selectedData=allPerjalanan.find(x=>x.docId===id);if(!selectedData){showToast("Data tidak ditemukan");return;}popupInfo.innerHTML=`<b>Driver:</b> ${escapeHtml(selectedData.namaDriver||"-")}<br><b>Siswa:</b> ${escapeHtml(selectedData.namaSiswa||"-")}<br><b>Kelas:</b> ${escapeHtml(selectedData.kelas||"-")}<br><b>No HP:</b> ${escapeHtml(selectedData.noTelepon||"-")}<br><b>Alamat:</b> ${escapeHtml(selectedData.alamat||"-")}<br><b>Tanggal:</b> ${escapeHtml(selectedData.tanggal||"-")}<br><b>Jarak:</b> ${escapeHtml(selectedData.jarak||0)} Km<br><b>Trayek:</b> ${escapeHtml((selectedData.trayek||"-").toUpperCase())}<br><b>OW:</b> ${escapeHtml(rupiah(selectedData.hargaOneWay||selectedData.hargaDasar||0))}<br><b>PP90%:</b> ${escapeHtml(rupiah(selectedData.hargaPP90||0))}<br><b>Total:</b> ${escapeHtml(rupiah(selectedData.total||0))}`;popupDetail.style.display="flex";}
function closePopup(){popupDetail.style.display="none";}

function openEditForm(){
  if(role!=="admin"){editDriver.disabled=true;}else{editDriver.disabled=false;}
  if(!selectedData){showToast("Data belum dipilih");return;}
  closePopup();listSection.classList.add("hidden");editSection.classList.remove("hidden");
  renderDriverOptions(selectedData.driverId||"",selectedData.namaDriver||"");
  editTgl.value=selectedData.tanggal||"";editSiswa.value=selectedData.namaSiswa||"";editKelas.value=selectedData.kelas||"";editAlamat.value=selectedData.alamat||"";editNoTelepon.value=selectedData.noTelepon||"";editJarak.value=selectedData.jarak||"";editTrayek.value=selectedData.trayek||"pergi";
  if(selectedData.trayek==="pp"){editDiscPP.value=Number(selectedData.diskon||0);editDiscOneWay.value=0;}else{editDiscOneWay.value=Number(selectedData.diskon||0);editDiscPP.value=0;}
  recalc();
}

function recalc(){
  const jarak=Number(editJarak.value||0);
  const trayek=editTrayek.value;
  const ow=hitungHargaDasar(jarak);
  const pp90=Math.round(ow*1.8);

  if(trayek==="pp"){editOneWayBox.classList.add("hidden");editPPBox.classList.remove("hidden");}
  else{editOneWayBox.classList.remove("hidden");editPPBox.classList.add("hidden");}

  if(trayek==="pp"){
    const disc=Number(editDiscPP.value||0);
    const total=Math.round(pp90 - (pp90*disc/100));
    editHargaPP.value=rupiah(pp90);
    editTotalPP.value=rupiah(total);
    editTotal.value=rupiah(total);
    editHargaOneWay.value="";editTotalOneWay.value="";
  }else{
    const disc=Number(editDiscOneWay.value||0);
    const total=Math.round(ow - (ow*disc/100));
    editHargaOneWay.value=rupiah(ow);
    editTotalOneWay.value=rupiah(total);
    editTotal.value=rupiah(total);
    editHargaPP.value="";editTotalPP.value="";
  }
}

async function saveChange(){
  if(!selectedDocId){showToast("Data belum dipilih");return;}
  const driverId=editDriver.value;
  let driverObj=allDrivers.find(d=>d.docId===driverId);
  if(!driverObj&&selectedData){driverObj={docId:selectedData.driverId||"",nama:selectedData.namaDriver||"",idAnggota:selectedData.idAnggotaDriver||""}}
  if(!driverObj?.nama||!editTgl.value||!editSiswa.value.trim()||!editKelas.value.trim()||!editAlamat.value.trim()||!editNoTelepon.value.trim()||!Number(editJarak.value||0)||!editTrayek.value){showToast("Lengkapi semua data");return;}

  const jarak=Number(editJarak.value||0);
  const trayek=editTrayek.value;
  const ow=hitungHargaDasar(jarak);
  const pp90=Math.round(ow*1.8);
  let diskon=0,total=0;

  if(trayek==="pp"){diskon=Number(editDiscPP.value||0); total=Math.round(pp90 - (pp90*diskon/100));}
  else{diskon=Number(editDiscOneWay.value||0); total=Math.round(ow - (ow*diskon/100));}

  const payload={
    driverId:driverObj?.docId||"",
    idAnggotaDriver:driverObj?.idAnggota||"",
    namaDriver:driverObj?.nama||"",
    tanggal:editTgl.value,
    namaSiswa:editSiswa.value.trim(),
    kelas:editKelas.value.trim(),
    alamat:editAlamat.value.trim(),
    noTelepon:editNoTelepon.value.trim(),
    jarak,trayek,
    hargaDasar:ow,
    hargaOneWay:ow,
    hargaPP:pp90,
    hargaPP90:pp90,
    diskon,total
  };

  try{
    await updateDoc(doc(db,"perjalanan",selectedDocId),payload);
    await saveLog("Edit Data", `Siswa: ${editSiswa.value.trim()} | Driver: ${driverObj.nama} | ${jarak}km ${trayek.toUpperCase()} | OW:${rupiah(ow)} PP90:${rupiah(pp90)} | Total Baru: ${rupiah(total)}`);
    showToast("Data berhasil diperbarui - "+rupiah(total));
    cancelEdit();await loadPerjalanan();
  }catch(e){console.error(e);showToast("Gagal menyimpan");}
}

function cancelEdit(){editSection.classList.add("hidden");listSection.classList.remove("hidden");selectedData=null;selectedDocId=null;}
async function deleteSelected(){
  if(!selectedDocId){showToast("Data belum dipilih");return;}
  const nama=selectedData.namaSiswa;
  if(!confirm(`Hapus data ${nama}?`)) return;
  try{
    await deleteDoc(doc(db,"perjalanan",selectedDocId));
    await saveLog("Hapus Data", `Siswa: ${nama} | Driver: ${selectedData.namaDriver}`);
    closePopup();selectedData=null;selectedDocId=null;showToast("Data dihapus");await loadPerjalanan();
  }catch(e){showToast("Gagal hapus");}
}

searchBox.addEventListener("input",searchData);
popupDetail.addEventListener("click",(e)=>{if(e.target===popupDetail)closePopup();});

window.openEditForm=openEditForm;window.closePopup=closePopup;window.deleteSelected=deleteSelected;window.saveChange=saveChange;window.cancelEdit=cancelEdit;window.recalc=recalc;
document.addEventListener("DOMContentLoaded",async()=>{await loadConfigHarga();await loadDrivers();await loadPerjalanan();});
window.kembali=function(){location.href="dashboard.html";}
</script>
</body>
</html>
