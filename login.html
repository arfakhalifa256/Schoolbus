<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',Arial;
  background:linear-gradient(135deg,#1e90ff,#3b82f6);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  padding:16px;
}
.box{
  background:#fff;
  padding:24px;
  border-radius:20px;
  width:100%;
  max-width:360px;
  box-shadow:0 20px 40px rgba(0,0,0,0.15);
  animation:fadeIn.3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:16px}
.logo img{width:70px;height:70px;border-radius:18px;background:#1e90ff;padding:8px}
.logo h2{margin-top:8px;font-size:20px;color:#1e293b;font-weight:700}
.logo p{font-size:12px;color:#64748b}
input{
  width:100%;
  height:44px;
  margin-bottom:12px;
  padding:0 12px;
  border:1.5px solid #e2e8f0;
  border-radius:10px;
  font-size:13px;
  outline:none;
  transition:.2s;
}
input:focus{border-color:#1e90ff}
.btn{
  width:100%;
  height:44px;
  background:#1e90ff;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  margin-bottom:8px;
  transition:.2s;
}
.btn:hover{background:#0f6ecf}
.btn:disabled{background:gray}
.btn-outline{
  background:#fff;
  color:#1e90ff;
  border:1.5px solid #1e90ff;
}
.link-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:12px;
}
.link{
  color:#1e90ff;
  cursor:pointer;
  font-weight:600;
}
#loading{
  display:none;
  text-align:center;
  font-size:12px;
  color:#64748b;
  margin:8px 0;
}
/* POPUP LUPA PASSWORD */
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:2000}
.popup-content{background:#fff;padding:20px;border-radius:16px;width:90%;max-width:320px}
.popup-content h3{margin-bottom:10px;font-size:16px}
</style>
</head>

<body>

<div class="box">
  <div class="logo">
    <img src="./img/icon-512.png" alt="Logo">
    <h2>School Bus</h2>
    <p id="subtitle">Masuk untuk melanjutkan</p>
  </div>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <div class="link-row">
    <div class="link" onclick="toggleMode()" id="toggleText">Belum punya akun? Daftar</div>
    <div class="link" onclick="showLupaPass()">Lupa Password?</div>
  </div>

  <button class="btn" id="btnLogin" onclick="login()">Login</button>
  <button class="btn btn-outline" id="btnRegister" onclick="register()" style="display:none;">Daftar</button>

  <div id="loading">⏳ Loading...</div>
</div>

<!-- POPUP LUPA PASSWORD -->
<div id="popupLupa" class="popup">
  <div class="popup-content">
    <h3>🔒 Reset Password</h3>
    <input type="text" id="resetUser" placeholder="Masukkan Username">
    <input type="password" id="resetPassBaru" placeholder="Password Baru">
    <button class="btn" onclick="resetPassword()">Reset</button>
    <button class="btn btn-outline" onclick="closeLupa()">Batal</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxbArCZ6iIWQ8wS7QIonZOeN4t_r9o2WU",
  authDomain: "schoolbus-6a7fd.firebaseapp.com",
  projectId: "schoolbus-6a7fd",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= FUNGSI LOG AKTIVITAS =================
async function saveLog(aktivitas, detail=""){
  try{
    const username = localStorage.getItem("username") || "Guest";
    const role = localStorage.getItem("role") || "-";
    await addDoc(collection(db, "logs"), {
      username: username,
      role: role,
      aktivitas: aktivitas, // contoh: "Login", "Logout", "Register"
      detail: detail, // contoh: "Login dari Bintarojaya"
      waktu: serverTimestamp()
    });
  }catch(e){ console.log("Gagal simpan log:", e) }
}

// ================= MODE =================
let mode = "login";
window.toggleMode = function(){
  mode = mode === "login"? "register" : "login";
  document.getElementById("subtitle").innerText = mode === "login"? "Masuk untuk melanjutkan" : "Buat akun baru";
  document.getElementById("btnLogin").style.display = mode === "login"? "block" : "none";
  document.getElementById("btnRegister").style.display = mode === "register"? "block" : "none";
  document.getElementById("toggleText").innerText = mode === "login"? "Belum punya akun? Daftar" : "Sudah punya akun? Login";
};

// ================= REGISTER =================
window.register = async function(){
  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const username = usernameEl.value.trim();
  const password = passwordEl.value.trim();
  const loading = document.getElementById("loading");

  if(!username ||!password){ alert("Isi semua field"); return; }
  loading.style.display = "block";

  const snapshot = await getDocs(collection(db,"users"));
  let exist = false;
  snapshot.forEach(docSnap=>{ if(docSnap.data().username === username){ exist = true; } });

  if(exist){ loading.style.display = "none"; alert("Username sudah dipakai"); return; }

  const id = "USR" + Date.now();
  await setDoc(doc(db,"users",id),{ username, password, role: "driver", driverId: id });
  await setDoc(doc(db,"drivers",id),{ driverId: id, namaDriver: username, username, createdAt: Date.now() });

  await saveLog("Register", `Akun baru: ${username}`); // 🔥 LOG

  loading.style.display = "none";
  alert("Berhasil daftar! Silakan login");
  usernameEl.value = username;
  passwordEl.value = password;
  if(mode === "register"){ toggleMode(); }
};

// ================= LOGIN =================
window.login = async function(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const loading = document.getElementById("loading");

  if(!username ||!password){ alert("Isi username & password"); return; }
  loading.style.display = "block";

  const q = query(collection(db,"users"), where("username","==",username), where("password","==",password));
  const snapshot = await getDocs(q);
  loading.style.display = "none";

  if(snapshot.empty){
    await saveLog("Login Gagal", `Username: ${username}`); // 🔥 LOG GAGAL
    alert("Login gagal. Username/Password salah");
    return;
  }

  const found = snapshot.docs[0].data();
  localStorage.setItem("login","true");
  localStorage.setItem("username",found.username);
  localStorage.setItem("role",found.role);
  localStorage.setItem("driverId",found.driverId);

  await saveLog("Login", `Login sebagai ${found.role}`); // 🔥 LOG SUKSES

  if(found.role === "admin"){ window.location.replace("dashboard.html"); }
  else { window.location.replace("input.html"); }
};

// ================= LUPA PASSWORD =================
window.showLupaPass = function(){ document.getElementById("popupLupa").style.display = "flex"; }
window.closeLupa = function(){ document.getElementById("popupLupa").style.display = "none"; }

window.resetPassword = async function(){
  const user = document.getElementById("resetUser").value.trim();
  const passBaru = document.getElementById("resetPassBaru").value.trim();
  if(!user ||!passBaru){ alert("Isi semua"); return; }

  const q = query(collection(db,"users"), where("username","==",user));
  const snap = await getDocs(q);

  if(snap.empty){ alert("Username tidak ditemukan"); return; }

  const docId = snap.docs[0].id;
  await updateDoc(doc(db,"users",docId),{ password: passBaru });

  await saveLog("Reset Password", `Reset untuk: ${user}`); // 🔥 LOG

  alert("✅ Password berhasil direset");
  closeLupa();
}

// 🔥 KUNCI: Kalau udah login, lempar sesuai role
if(localStorage.getItem("login") === "true"){
  const role = localStorage.getItem("role");
  if(role === "driver"){
    window.location.replace("input.html");
  } else {
    window.location.replace("dashboard.html");
  }
}

// 🔥 CEGAH KEMBALI KE HALAMAN SEBELUMNYA SETELAH LOGIN
history.pushState(null, null, location.href);
window.onpopstate = function () {
    history.go(1);
};
</script>
</body>
</html>
